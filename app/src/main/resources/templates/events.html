<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Events</title>
</head>
<body>
    <h2>Welcome, <span th:text="${userId}"></span> | <a th:href="@{/logout}">Logout</a></h2>
    <ul>
        <li th:each="event : ${events}">
            <a th:href="@{/events/{id}/seats(id=${event.eventId})}" th:text="${event.name}"></a>
            - <span th:text="${event.venue}"></span>
        </li>
    </ul>
</body>
</html>
