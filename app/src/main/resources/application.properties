spring.application.name=ticket-booking-system

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bookingdb
spring.datasource.username=booking_user
spring.datasource.password=booking_pass123
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# MongoDB (booking attempt logs)
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=bookingLogs

# Redis (distributed sessions)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.session.store-type=redis
spring.session.timeout=30m

# Actuator - expose health for HAProxy
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Server
server.port=8080
